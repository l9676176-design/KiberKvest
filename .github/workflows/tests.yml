name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы
        uses: actions/checkout@v4
      - name: Подключить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Запустить тесты
        run: npm test
